# Replace both values after creating the project in SonarQube Cloud
# (My Account > Organizations shows the key; the project key is shown on the project page).
sonar.organization=YOUR_SONAR_ORG_KEY
sonar.projectKey=YOUR_SONAR_PROJECT_KEY

sonar.sources=src
sonar.tests=test
sonar.javascript.lcov.reportPaths=lcov.info
sonar.sourceEncoding=UTF-8
